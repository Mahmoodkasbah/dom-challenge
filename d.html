<!doctype html>
<html lang="ar" dir="rtl">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>تسجيل جديد</title>

    <style>
      * {
        margin: 0;
        padding: 0;
        box-sizing: border-box;
        font-family: Tahoma, Arial, sans-serif;
      }

      body {
        background: linear-gradient(135deg, #4facfe, #00f2fe);
        display: flex;
        justify-content: center;
        align-items: center;
        height: 100vh;
      }

      .container {
        width: 400px;
        background: #fff;
        padding: 30px;
        border-radius: 15px;
        box-shadow: 0 10px 25px rgba(0, 0, 0, 0.2);
      }

      h1 {
        text-align: center;
        margin-bottom: 25px;
        color: #333;
      }

      label {
        display: block;
        margin-bottom: 6px;
        margin-top: 15px;
        font-weight: bold;
        color: #444;
      }

      input,
      select {
        width: 100%;
        padding: 12px;
        border: 1px solid #ccc;
        border-radius: 8px;
        outline: none;
        font-size: 15px;
        transition: 0.3s;
      }

      input:focus,
      select:focus {
        border-color: #2196f3;
        box-shadow: 0 0 8px rgba(33, 150, 243, 0.3);
      }

      button {
        width: 100%;
        margin-top: 25px;
        padding: 12px;
        background: #2196f3;
        color: white;
        border: none;
        border-radius: 8px;
        cursor: pointer;
        font-size: 18px;
        transition: 0.3s;
      }

      button:hover {
        background: #1976d2;
      }
    </style>
  </head>
  <body>
    <div class="container">
      <h1>تسجيل جديد</h1>

      <form>
             <!-- الاسم الكامل -->
            <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="fullName" placeholder="أدخل اسمك الكامل" required>
                <div class="error-message" id="nameError">الاسم يجب أن يكون 3 أحرف على الأقل</div>
                <div class="success-message" id="nameSuccess">✓ اسم صحيح</div>
            </div>
                   <div class="form-group">
                <label>الاسم الكامل</label>
                <input type="text" id="full" placeholder="أدخل اسمك الكامل" required>
                <div class="error-message" id="nameError">الاسم يجب أن يكون 3 أحرف على الأقل</div>
                <div class="success-message" id="nameSuccess">✓ اسم صحيح</div>
            </div>
   
    <script>
let input = document.getElementById("fullName");

input.addEventListener("input", function () {
  let x = input.value.length;

  if (x > 1) {
    document.getElementById("full").focus();
  }
});
    </script>
  </body>
</html>
